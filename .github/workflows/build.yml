name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange project
        run: |
          D=app/src/main/java/com/example/tftbridge
          mkdir -p $D
          mv *.java $D/
          mv AndroidManifest.xml app/src/main/
          cat > settings.gradle <<'EOT'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "TFTBridge"
          include ':app'
          EOT
          echo "plugins { id 'com.android.application' version '8.7.3' apply false }" > build.gradle
          printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2g\n' > gradle.properties
          cat > app/build.gradle <<'EOT'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.tftbridge'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.example.tftbridge'
                  minSdk 30
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }a
          dependencies { implementation 'androidx.activity:activity:1.9.3' }
          EOT
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tft-bridge-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
