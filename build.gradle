plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.example.tftbridge'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.tftbridge'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.9.3'
}
